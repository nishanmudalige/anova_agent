<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ANOVA Assistant</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

<div class="chat-container">

  <div class="chat-header">
    ANOVA Assistant
  </div>

  <div
    id="messages"
    class="messages"
  >

    <div class="message assistant">
      Ask me about the ANOVA assumptions,
      group variability, or the boxplots.
    </div>

  </div>

  <div class="input-area">

    <textarea
      id="messageInput"
      placeholder="Ask a question..."
      rows="2"
    ></textarea>

    <button id="sendButton">
      Send
    </button>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
